<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>MediClock Neo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registrado:', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker error:', err);
                });
            });
        }
    </script>
    
    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(15, 15, 25, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.02);
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ea;
            --neon-violet: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-green: #00ff88;
            --neon-orange: #ff6b35;
            --neon-yellow: #ffd700;
            --neon-pink: #ff1493;
            --neon-teal: #00ced1;
            --glow-cyan: 0 0 30px rgba(0, 245, 255, 0.4);
            --glow-magenta: 0 0 30px rgba(255, 0, 234, 0.4);
            --glow-violet: 0 0 30px rgba(139, 92, 246, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --border-glow: rgba(0, 245, 255, 0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .bg-animation::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            animation: bgPulse 15s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(-5%, -5%) scale(1.1); } 66% { transform: translate(5%, 5%) scale(0.95); } }

        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 20s ease-in-out infinite; pointer-events: none; z-index: 0; }
        .orb-1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: var(--neon-magenta); bottom: -50px; left: -50px; animation-delay: -7s; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-violet); top: 50%; left: 50%; animation-delay: -14s; }

        @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(50px, -50px) rotate(90deg); } 50% { transform: translate(-30px, 30px) rotate(180deg); } 75% { transform: translate(20px, 50px) rotate(270deg); } }

        .grid-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: 0; pointer-events: none; }
        .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 2rem 1rem; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 1.5rem; position: relative; }
        .logo { display: inline-flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; box-shadow: var(--glow-cyan), var(--glow-magenta); animation: iconPulse 3s ease-in-out infinite; position: relative; }
        .logo-text { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-violet)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .tabs { display: flex; background: rgba(10, 10, 20, 0.8); border-radius: var(--radius-lg); padding: 0.25rem; margin-bottom: 1.5rem; border: 1px solid rgba(0, 245, 255, 0.1); backdrop-filter: blur(10px); }
        .tab { flex: 1; text-align: center; padding: 0.75rem 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); background: transparent; border: none; border-radius: var(--radius-md); cursor: pointer; transition: 0.3s; }
        .tab.active { background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(139, 92, 246, 0.15)); color: var(--neon-cyan); }

        /* FIX VISUAL: Estructura corregida para Fila Superior 100% */
        .med-item {
            display: flex;
            flex-wrap: wrap; /* Permitir que los elementos bajen de fila */
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            margin-bottom: 0.875rem;
            cursor: pointer;
            position: relative;
        }

        .med-name-row {
            width: 100%; /* Ocupa todo el ancho superior */
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem;
            padding-right: 40px; /* Evita que el nombre choque con el botón eliminar */
        }

        .med-name {
            font-size: 1.25rem; font-weight: 700; color: var(--text-primary);
            text-transform: uppercase; letter-spacing: 0.02em; display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .med-patient { font-size: 0.85rem; color: var(--neon-cyan); font-weight: 600; }

        .med-avatar, .med-placeholder {
            width: 60px; height: 60px; border-radius: var(--radius-md);
            object-fit: cover; border: 2px solid rgba(0, 245, 255, 0.3);
            flex-shrink: 0; margin-top: 0 !important;
        }

        .med-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .med-actions {
            position: absolute; /* Posición fija a la derecha */
            top: 1.25rem;
            right: 1.25rem;
            margin-top: 0 !important;
        }
        .time-chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.8rem; font-size: 0.75rem; font-weight: 600; background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.3); border-radius: 20px; }
        .add-time-btn { width: 28px; height: 28px; background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.3); border-radius: 50%; color: var(--neon-cyan); cursor: pointer; }
        .med-delete { width: 36px; height: 36px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--text-muted); cursor: pointer; }
        
        .card { background: var(--bg-card); backdrop-filter: blur(40px); border: 1px solid var(--border-glow); border-radius: var(--radius-xl); padding: 1.75rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
        .form-input { width: 100%; padding: 1rem 1.25rem; color: var(--text-primary); background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-md); outline: none; }
        .qty-btn { width: 52px; height: 52px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-md); color: var(--neon-cyan); font-size: 1.5rem; cursor: pointer; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 1rem 1.75rem; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: 0.4s; }
        .btn-primary { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color: var(--bg-dark); box-shadow: var(--glow-cyan); width: 100%; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); z-index: 1000; align-items: center; justify-content: center; padding: 1.25rem; }
        .modal-bg.open { display: flex; }
        .modal { background: linear-gradient(180deg, rgba(20, 20, 35, 0.95), rgba(10, 10, 18, 0.98)); border: 1px solid rgba(0, 245, 255, 0.2); border-radius: var(--radius-xl); width: 100%; max-width: 420px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
        .alert-medication-img { width: 100%; height: 120px; object-fit: cover; border-radius: var(--radius-md); border: 2px solid rgba(0, 245, 255, 0.3); margin-bottom: 1rem; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent); opacity: 0.3; animation: scan 8s linear infinite; pointer-events: none; z-index: 9999; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .color-1 { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); }
        .color-2 { background: linear-gradient(135deg, var(--neon-magenta), var(--neon-violet)); }
    </style>
</head>
<body>
    <!-- FIX iOS Background: Audio Tag Base64 para latido de silencio -->
    <audio id="iosWakeAudio" loop playsinline src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA"></audio>

    <div class="bg-animation"></div>
    <div class="grid-pattern"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    <div class="scanline"></div>

    <div class="app">
        <header class="header">
            <div class="logo"><div class="logo-icon">💊</div><span class="logo-text">MediClock</span><span class="logo-badge">NEO</span></div>
        </header>

        <div class="tabs">
            <button class="tab active" id="tabNuevo" data-tab="nuevo">✨ Nuevo</button>
            <button class="tab" id="tabMedicamentos" data-tab="medicamentos">💊 Mis Medicamentos</button>
        </div>

        <div class="tab-content active" id="tabContentNuevo">
            <div class="card">
                <div class="form-group"><label class="form-label">Medicamento</label><input type="text" id="nombre" class="form-input" placeholder="Ej: Paracetamol"></div>
                <div class="form-group"><label class="form-label">Paciente</label><input type="text" id="paciente" class="form-input" placeholder="Ej: María García"></div>
                <div class="form-group"><label class="form-label">Cantidad</label>
                    <div class="qty-row"><button class="qty-btn" id="menos">−</button><input type="number" id="cant" class="form-input" value="1" step="0.25" style="text-align:center"><button class="qty-btn" id="mas">+</button></div>
                </div>
                <div class="form-group"><label class="form-label">Hora</label><input type="time" id="hora" class="form-input"></div>
                <div class="form-group"><div class="photo-zone" id="photoZone">📷 Capturar Foto</div><img id="photoPreview" class="photo-preview"></div>
                <button class="btn btn-primary" id="addBtn">⚡ Agregar</button>
                
                <div class="settings" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
                    <div id="settingsToggle" style="cursor:pointer; display:flex; justify-content:space-between;"><span>⚙️ Configuración</span><span id="settingsArrow">▼</span></div>
                    <div id="settingsPanel" style="display:none; padding-top:15px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Sonido</span><input type="checkbox" id="sonidoOn" checked></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Voz</span><input type="checkbox" id="vozOn" checked></div>
                        <div><span>Volumen</span><input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.7"><span id="volValue">70%</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tabContentMedicamentos">
            <div class="card">
                <ul class="med-list" id="lista"></ul>
                <div class="empty" id="empty" style="text-align:center; padding:2rem;"><h3>Sin medicamentos</h3></div>
                <div style="display:flex; gap:10px; margin-top:20px;"><button class="btn btn-secondary" id="calBtn">📅 Historial</button><button class="btn btn-secondary" id="testBtn">🧪 Test Alarma</button></div>
            </div>
        </div>
    </div>
    <!-- Modales (Alert, Detail, Calendar, AddTime, EditTime) -->
    <div class="modal-bg" id="alertModal"><div class="modal" style="padding:2rem; text-align:center"><div style="font-size:3rem">⏰</div><h2 id="alertGreeting"></h2><div id="alertTimeDisplay" style="color:var(--neon-cyan); font-size:2rem"></div><div id="alertMedicationsList"></div><div style="display:flex; gap:10px; margin-top:2rem"><button class="btn btn-secondary" id="alertClose">Cerrar</button><button class="btn btn-primary" id="alertTake">✓ Tomado</button></div></div></div>
    <div class="modal-bg" id="detailModal"><div class="modal" style="padding:2rem"><img id="detailMainImg" class="alert-medication-img"><h2 id="detailName"></h2><p id="detailPatient"></p><div id="detailTimes"></div><button class="btn btn-secondary" id="detailClose" style="margin-top:1rem">Cerrar</button></div></div>
    <div class="modal-bg" id="calModal"><div class="modal" style="padding:2rem"><h2>Historial</h2><div id="calBody" style="max-height:300px; overflow-y:auto; margin:1rem 0"></div><button class="btn btn-secondary" id="calClose">Cerrar</button></div></div>
    <div class="modal-bg" id="addTimeModal"><div class="modal" style="padding:2rem"><h3>Añadir Hora</h3><input type="time" id="newHora" class="form-input" style="margin:1rem 0"><input type="number" id="newCant" class="form-input" value="1" step="0.25"><div style="display:flex; gap:10px; margin-top:1rem"><button class="btn btn-secondary" id="cancelAddTime">Cancelar</button><button class="btn btn-primary" id="saveAddTime">Guardar</button></div></div></div>
    <div class="modal-bg" id="editTimeModal"><div class="modal" style="padding:2rem"><h3>Editar Hora</h3><input type="time" id="editHora" class="form-input" style="margin:1rem 0"><input type="number" id="editCant" class="form-input" value="1" step="0.25"><div style="display:flex; gap:10px; margin-top:1rem"><button class="btn btn-danger" id="deleteTime">Eliminar</button><button class="btn btn-primary" id="saveEditTime">Guardar</button></div></div></div>

    <audio id="audio" preload="auto" loop></audio>

    <script>
        // FIX iOS Background: Desbloqueo de audio silencioso al primer toque
        function initAudioHack() {
            const silentAudio = document.getElementById('iosWakeAudio');
            if (silentAudio) {
                silentAudio.play().then(() => {
                    console.log("🚀 Background Hack Activado");
                    window.removeEventListener('touchstart', initAudioHack);
                    window.removeEventListener('click', initAudioHack);
                }).catch(err => console.log("Audio Hack esperando interacción..."));
            }
        }
        window.addEventListener('touchstart', initAudioHack, { once: true });
        window.addEventListener('click', initAudioHack, { once: true });

        // TODA TU LÓGICA ORIGINAL PRESERVADA
        let meds = JSON.parse(localStorage.getItem('medsMC2') || '{}');
        let foto = '';
        let alarmaOn = false;
        let medsActuales = [];
        let horaActual = '';
        let intervalo = null;
        let medColors = {};
        let currentMedForAddTime = null;
        let editingTimeData = null;
        let checkInterval = null;

        const $ = id => document.getElementById(id);
        const upper = t => t ? t.toString().toUpperCase().trim() : '';

        function initializeAlarmSystem() {
            if ('Notification' in window) Notification.requestPermission();
            checkAlarms();
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkAlarms, 30000); 
            document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAlarms(); });
        }

        function checkAlarms() {
            const now = new Date();
            const currentTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            medsActuales = [];
            let alarmTriggered = false;
            const today = now.toISOString().slice(0, 10);

            Object.keys(meds).forEach(id => {
                const m = meds[id];
                m.horas.forEach(h => {
                    if (h.h === currentTime) {
                        medsActuales.push({id, paciente: m.paciente, nombre: m.nombre, cantidad: h.cant, foto: m.foto});
                        alarmTriggered = true;
                    }
                });
            });

            if (alarmTriggered && medsActuales.length > 0) {
                const fireKey = `fired_${today}_${currentTime}`;
                if (!localStorage.getItem(fireKey)) {
                    horaActual = currentTime;
                    showAlert();
                    localStorage.setItem(fireKey, 'true');
                }
            }
        }

        function playAlarmSound() {
            if (!sonidoOn.checked || alarmaOn) return;
            const audio = $('audio');
            audio.src = 'https://assets.mixkit.co/sfx/download/mixkit-digital-alarm-buzzer-992.wav';
            audio.volume = parseFloat(volSlider.value);
            audio.play().then(() => alarmaOn = true).catch(() => {
                intervalo = setInterval(() => { new Audio('https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3').play(); }, 2000);
            });
        }

        function stopAlarm() {
            alarmaOn = false;
            if (intervalo) clearInterval(intervalo);
            $('audio').pause();
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        async function playVoiceReminder() {
            if (!vozOn.checked || !('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            let msg = `Atención, son las ${horaActual}. Es hora de medicación para `;
            const pacientes = [...new Set(medsActuales.map(m => m.paciente))];
            msg += pacientes.join(' y ') + ".";
            const u = new SpeechSynthesisUtterance(msg);
            u.lang = 'es-ES'; u.volume = parseFloat(volSlider.value);
            speechSynthesis.speak(u);
        }

        function showAlert() {
            $('alertTimeDisplay').textContent = horaActual;
            $('alertGreeting').textContent = "Hora de medicación";
            $('alertMedicationsList').innerHTML = medsActuales.map(m => `<div><b>${upper(m.nombre)}</b> - ${m.cantidad}u</div>`).join('');
            alertModal.classList.add('open');
            playAlarmSound();
            playVoiceReminder();
        }
        function render() {
            lista.innerHTML = '';
            const keys = Object.keys(meds);
            empty.style.display = keys.length ? 'none' : 'block';
            keys.forEach(id => {
                const m = meds[id];
                const colorClass = getMedColor(m.nombre);
                const li = document.createElement('li');
                li.className = 'med-item';
                // El HTML de render ahora incluye el med-name-row arriba del todo
                li.innerHTML = `
                    <div class="med-name-row">
                        <div class="med-name">${upper(m.nombre)}</div>
                        <div class="med-patient">${upper(m.paciente)}</div>
                    </div>
                    ${m.foto ? `<img src="${m.foto}" class="med-avatar">` : `<div class="med-placeholder ${colorClass}">💊</div>`}
                    <div class="med-info">
                        <div class="med-times">
                            ${m.horas.map(h => `<span class="time-chip">${h.h} · ${h.cant}u</span>`).join('')}
                            <button class="add-time-btn" data-id="${id}">+</button>
                        </div>
                    </div>
                    <div class="med-actions"><button class="med-delete" data-id="${id}">🗑️</button></div>
                `;
                li.onclick = e => { if(!e.target.closest('.med-delete, .add-time-btn')) showDetail(id); };
                li.querySelector('.med-delete').onclick = e => { e.stopPropagation(); if(confirm('¿Eliminar?')){ delete meds[id]; save(); render(); }};
                li.querySelector('.add-time-btn').onclick = e => { e.stopPropagation(); currentMedForAddTime = id; addTimeModal.classList.add('open'); };
                lista.appendChild(li);
            });
        }

        function getMedColor(n) { if(!medColors[n]) { const c=['color-1','color-2']; medColors[n]=c[Object.keys(medColors).length%2]; } return medColors[n]; }
        function save() { localStorage.setItem('medsMC2', JSON.stringify(meds)); }

        photoZone.onclick = () => {
            const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.capture='environment';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const scale = 600 / img.width; canvas.width = 600; canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, 600, canvas.height);
                        foto = canvas.toDataURL('image/jpeg', 0.6);
                        photoPreview.src = foto; photoPreview.classList.add('active'); photoZone.style.display='none';
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        };

        $('addBtn').onclick = () => {
            const n = upper(nombre.value); const p = upper(paciente.value);
            if (!n || !p || !hora.value) return alert('Faltan datos');
            const id = Date.now().toString();
            meds[id] = { nombre: n, paciente: p, foto, horas: [{h: hora.value, cant: parseFloat(cant.value)}] };
            save(); render(); cambiarTab('medicamentos');
            nombre.value=''; paciente.value=''; foto=''; photoPreview.classList.remove('active'); photoZone.style.display='block';
        };

        $('alertTake').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            medsActuales.forEach(m => hist.push({fecha: new Date().toISOString(), nombre: m.nombre, paciente: m.paciente, hora: horaActual}));
            localStorage.setItem('tomasMC', JSON.stringify(hist));
            alertModal.classList.remove('open'); stopAlarm();
        };

        $('settingsToggle').onclick = () => { settingsPanel.style.display = settingsPanel.style.display==='none' ? 'block':'none'; settingsArrow.textContent = settingsPanel.style.display==='none' ? '▼':'▲'; };
        volSlider.oninput = function() { volValue.textContent = Math.round(this.value*100)+'%'; };

        function cambiarTab(t) {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            $(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            $(`tabContent${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            if(t==='medicamentos') render();
        }

        window.onload = () => { render(); initializeAlarmSystem(); };
    </script>
</body>
</html>
