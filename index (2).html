<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>MediClock Neo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registrado:', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker error:', err);
                });
            });
        }
    </script>
    
    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(15, 15, 25, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.02);
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ea;
            --neon-violet: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-green: #00ff88;
            --neon-orange: #ff6b35;
            --neon-yellow: #ffd700;
            --neon-pink: #ff1493;
            --neon-teal: #00ced1;
            --glow-cyan: 0 0 30px rgba(0, 245, 255, 0.4);
            --glow-magenta: 0 0 30px rgba(255, 0, 234, 0.4);
            --glow-violet: 0 0 30px rgba(139, 92, 246, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --border-glow: rgba(0, 245, 255, 0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .bg-animation::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            animation: bgPulse 15s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: scale(1.1); } }

        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 20s ease-in-out infinite; pointer-events: none; z-index: 0; }
        .orb-1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: var(--neon-magenta); bottom: -50px; left: -50px; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-violet); top: 50%; left: 50%; }

        @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-30px, 30px) rotate(180deg); } }

        .grid-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: 0; pointer-events: none; }
        .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 2rem 1rem; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 1.5rem; }
        .logo { display: inline-flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; box-shadow: var(--glow-cyan), var(--glow-magenta); animation: iconPulse 3s ease-in-out infinite; position: relative; }
        .logo-text { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-violet)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .tabs { display: flex; background: rgba(10, 10, 20, 0.8); border-radius: var(--radius-lg); padding: 0.25rem; margin-bottom: 1.5rem; border: 1px solid rgba(0, 245, 255, 0.1); backdrop-filter: blur(10px); }
        .tab { flex: 1; text-align: center; padding: 0.75rem 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); background: transparent; border: none; border-radius: var(--radius-md); cursor: pointer; transition: 0.3s; }
        .tab.active { background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(139, 92, 246, 0.15)); color: var(--neon-cyan); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--bg-card); backdrop-filter: blur(40px); border: 1px solid var(--border-glow); border-radius: var(--radius-xl); padding: 1.75rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; transition: 0.4s; }

        /* FIX VISUAL: .med-item Reestructurado para 100% de ancho en nombre */
        .med-item {
            display: flex;
            flex-wrap: wrap; /* Permite que el nombre ocupe una fila y el resto baje */
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            margin-bottom: 0.875rem;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            min-height: auto;
        }

        .med-name-row {
            width: 100%; /* Ocupa todo el ancho superior */
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem;
            padding-right: 40px; /* Espacio para el botón delete que es absoluto */
        }

        .med-name {
            font-size: 1.25rem; font-weight: 700; color: var(--text-primary);
            text-transform: uppercase; letter-spacing: 0.02em; display: block;
            width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .med-patient { font-size: 0.85rem; color: var(--neon-cyan); font-weight: 600; }

        .med-avatar, .med-placeholder {
            width: 60px; height: 60px; border-radius: var(--radius-md);
            object-fit: cover; border: 2px solid rgba(0, 245, 255, 0.3);
            flex-shrink: 0; margin-top: 0;
        }

        .med-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .med-times { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }

        .med-actions { position: absolute; top: 1.25rem; right: 1.25rem; }

        .med-delete {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-muted); cursor: pointer;
        }

        .time-chip { display: inline-flex; align-items: center; padding: 0.35rem 0.8rem; font-size: 0.75rem; font-weight: 600; background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.3); border-radius: 20px; }
        .add-time-btn { width: 28px; height: 28px; background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.3); border-radius: 50%; color: var(--neon-cyan); cursor: pointer; }

        .form-input { width: 100%; padding: 1rem 1.25rem; color: var(--text-primary); background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-md); outline: none; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 1rem 1.75rem; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: 0.4s; }
        .btn-primary { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color: var(--bg-dark); width: 100%; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.1); }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); z-index: 1000; align-items: center; justify-content: center; padding: 1.25rem; }
        .modal-bg.open { display: flex; }
        .modal { background: linear-gradient(180deg, rgba(20, 20, 35, 0.95), rgba(10, 10, 18, 0.98)); border: 1px solid rgba(0, 245, 255, 0.2); border-radius: var(--radius-xl); width: 100%; max-width: 420px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent); opacity: 0.3; animation: scan 8s linear infinite; pointer-events: none; z-index: 9999; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .color-1 { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); }
        .color-2 { background: linear-gradient(135deg, var(--neon-magenta), var(--neon-violet)); }
    </style>
</head>
    <body>
    <!-- FIX Background: Tag de audio silencioso Heartbeat -->
    <audio id="iosWakeAudio" loop playsinline src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA"></audio>
    <audio id="mainAlarmAudio" loop playsinline preload="auto"></audio>

    <div class="bg-animation"></div>
    <div class="grid-pattern"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    <div class="scanline"></div>

    <div class="app">
        <header class="header">
            <div class="logo"><div class="logo-icon">💊</div><span class="logo-text">MediClock</span><span class="logo-badge">NEO</span></div>
        </header>

        <div class="tabs">
            <button class="tab active" id="tabNuevo" data-tab="nuevo">✨ Nuevo</button>
            <button class="tab" id="tabMedicamentos" data-tab="medicamentos">💊 Mis Medicamentos</button>
        </div>

        <div class="tab-content active" id="tabContentNuevo">
            <div class="card">
                <div class="form-group"><label class="form-label">Medicamento</label><input type="text" id="nombre" class="form-input" placeholder="Ej: Paracetamol"></div>
                <div class="form-group"><label class="form-label">Paciente</label><input type="text" id="paciente" class="form-input" placeholder="Ej: Israel"></div>
                <div class="form-group"><label class="form-label">Cantidad</label>
                    <div style="display:flex; gap:10px;">
                        <button class="qty-btn" id="menos">−</button>
                        <input type="number" id="cant" class="form-input" value="1" step="0.25" style="text-align:center">
                        <button class="qty-btn" id="mas">+</button>
                    </div>
                </div>
                <div class="form-group"><label class="form-label">Hora</label><input type="time" id="hora" class="form-input"></div>
                <div class="form-group">
                    <div class="photo-zone" id="photoZone">📷 Capturar Foto del Medicamento</div>
                    <img id="photoPreview" class="photo-preview" style="width:100%; border-radius:12px; margin-top:10px; display:none;">
                </div>
                <button class="btn btn-primary" id="addBtn">⚡ AGREGAR MEDICACIÓN</button>
                
                <div class="settings" style="margin-top:2rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem;">
                    <div id="settingsToggle" style="cursor:pointer; display:flex; justify-content:space-between; color:var(--text-secondary);"><span>⚙️ AJUSTES DE AUDIO</span><span id="settingsArrow">▼</span></div>
                    <div id="settingsPanel" style="display:none; padding-top:1rem;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;"><span>Sonido de Alarma</span><input type="checkbox" id="sonidoOn" checked></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;"><span>Aviso por Voz</span><input type="checkbox" id="vozOn" checked></div>
                        <div style="margin-bottom:1rem;"><span>Volumen</span><input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.7" style="width:100%"><span id="volValue">70%</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tabContentMedicamentos">
            <div class="card">
                <ul class="med-list" id="lista"></ul>
                <div class="empty" id="empty" style="text-align:center; padding:2rem;"><h3>Sin medicamentos</h3></div>
                <div style="display:flex; gap:10px; margin-top:1rem;">
                    <button class="btn btn-secondary" id="calBtn" style="flex:1">📅 Historial</button>
                    <button class="btn btn-secondary" id="testBtn" style="flex:1">🧪 Probar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div class="modal-bg" id="alertModal">
        <div class="modal" style="padding:2rem; text-align:center;">
            <div style="font-size:3rem; margin-bottom:1rem;">⏰</div>
            <h2 id="alertGreeting">¡Es hora!</h2>
            <div id="alertTimeDisplay" style="font-size:2.5rem; color:var(--neon-cyan); margin:1rem 0; font-weight:800;">00:00</div>
            <div id="alertMedicationsList" style="margin-bottom:2rem; border-top:1px solid #333; padding-top:1rem;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" id="alertClose" style="flex:1">Cerrar</button>
                <button class="btn btn-primary" id="alertTake" style="flex:1; background:var(--neon-green); color:#000;">✓ Tomado</button>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="detailModal">
        <div class="modal" style="padding:2rem;">
            <img id="detailMainImg" style="width:100%; border-radius:12px; margin-bottom:1rem; display:none;">
            <h2 id="detailName"></h2>
            <p id="detailPatient" style="color:var(--neon-cyan); font-weight:600; margin-bottom:1rem;"></p>
            <div id="detailTimes"></div>
            <button class="btn btn-secondary" id="detailClose" style="margin-top:1.5rem; width:100%;">Cerrar</button>
        </div>
    </div>

    <div class="modal-bg" id="editTimeModal">
        <div class="modal" style="padding:2rem;">
            <h3>Editar Horario</h3>
            <input type="time" id="editHora" class="form-input" style="margin:1rem 0;">
            <input type="number" id="editCant" class="form-input" step="0.25">
            <div style="display:flex; gap:10px; margin-top:1.5rem;">
                <button class="btn" style="background:#ff4757; color:white; flex:1;" id="deleteTime">🗑 Eliminar</button>
                <button class="btn btn-primary" id="saveEditTime" style="flex:1;">Guardar</button>
            </div>
            <button class="btn btn-secondary" id="cancelEditTime" style="width:100%; margin-top:10px;">Cancelar</button>
        </div>
    </div>

    <div class="modal-bg" id="calModal">
        <div class="modal" style="padding:2rem;">
            <h2>Historial de Tomas</h2>
            <div id="calBody" style="max-height:350px; overflow-y:auto; margin:1.5rem 0;"></div>
            <button class="btn btn-secondary" id="calClose" style="width:100%;">Cerrar</button>
        </div>
    </div>
        <script>
        // --- SISTEMA DE SEGUNDO PLANO (HEARTBEAT) ---
        function initAudioHack() {
            const silentAudio = document.getElementById('iosWakeAudio');
            if (silentAudio) {
                // Iniciamos un bucle de silencio. Esto mantiene el proceso JS vivo en bloqueo.
                silentAudio.play().then(() => {
                    console.log("🚀 Heartbeat de audio activado para segundo plano");
                    window.removeEventListener('touchstart', initAudioHack);
                    window.removeEventListener('click', initAudioHack);
                }).catch(err => console.log("Audio bloqueado, esperando toque..."));
            }
        }
        window.addEventListener('touchstart', initAudioHack, { once: true });
        window.addEventListener('click', initAudioHack, { once: true });

        // --- VARIABLES Y PERSISTENCIA ---
        let meds = JSON.parse(localStorage.getItem('medsMC2') || '{}');
        let foto = '';
        let medsActuales = [];
        let horaActual = '';
        let alarmaOn = false;
        let medColors = {};
        let editingTimeData = null;
        let checkInterval = null;

        const $ = id => document.getElementById(id);
        const upper = t => t ? t.toString().toUpperCase().trim() : '';

        // --- SISTEMA DE ALARMAS ROBUSTO ---
        function initializeAlarmSystem() {
            if ('Notification' in window) Notification.requestPermission();
            
            checkAlarms();
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkAlarms, 15000); // Revisar cada 15 segs

            // Al volver al primer plano o encender pantalla, revisar inmediatamente
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) checkAlarms();
            });
        }

        function checkAlarms() {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const todayKey = now.toISOString().slice(0, 10);
            
            medsActuales = [];
            let hayAlarma = false;

            Object.keys(meds).forEach(id => {
                const m = meds[id];
                m.horas.forEach(h => {
                    if (h.h === timeStr) {
                        medsActuales.push({id, paciente: m.paciente, nombre: m.nombre, cantidad: h.cant, foto: m.foto});
                        hayAlarma = true;
                    }
                });
            });

            if (hayAlarma && medsActuales.length > 0) {
                const key = `fired_${todayKey}_${timeStr}_${medsActuales.map(x=>x.id).join('')}`;
                if (!localStorage.getItem(key)) {
                    horaActual = timeStr;
                    dispararAlerta();
                    localStorage.setItem(key, 'true');
                }
            }
        }

        function dispararAlerta() {
            // 1. Mostrar Modal
            const pacientes = [...new Set(medsActuales.map(m => m.paciente))];
            $('alertGreeting').textContent = `Hola ${pacientes.join(' y ')}`;
            $('alertTimeDisplay').textContent = horaActual;
            $('alertMedicationsList').innerHTML = medsActuales.map(m => `
                <div style="padding:10px; border-bottom:1px solid #222;">
                    <b>${upper(m.nombre)}</b>: ${m.cantidad} unidad(es)
                </div>
            `).join('');
            
            $('alertModal').classList.add('open');

            // 2. Audio (MediaSession para pantalla de bloqueo)
            if (sonidoOn.checked) {
                const audio = $('mainAlarmAudio');
                audio.src = 'https://assets.mixkit.co/sfx/download/mixkit-digital-alarm-buzzer-992.wav';
                audio.volume = parseFloat(volSlider.value);
                
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: '¡HORA DE MEDICACIÓN!',
                        artist: 'MediClock NEO Alerta',
                        artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/1237/1237460.png', sizes: '512x512', type: 'image/png' }]
                    });
                }
                audio.play().then(() => alarmaOn = true).catch(e => console.log("Audio bloqueado"));
            }

            // 3. Voz
            if (vozOn.checked && 'speechSynthesis' in window) {
                speechSynthesis.cancel();
                let msg = `Atención, son las ${horaActual}. Es hora de medicación para ${pacientes.join(' y ')}. `;
                medsActuales.forEach(m => msg += `Toma ${m.cantidad} de ${m.nombre}. `);
                const u = new SpeechSynthesisUtterance(msg);
                u.lang = 'es-ES'; u.volume = parseFloat(volSlider.value);
                speechSynthesis.speak(u);
            }

            if ('vibrate' in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
        }

        function stopAlarm() {
            alarmaOn = false;
            $('mainAlarmAudio').pause();
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            $('alertModal').classList.remove('open');
        }

        // --- GESTIÓN DE MEDICAMENTOS Y RENDER ---
        function render() {
            const lista = $('lista');
            lista.innerHTML = '';
            const keys = Object.keys(meds);
            $('empty').style.display = keys.length ? 'none' : 'block';

            keys.forEach(id => {
                const m = meds[id];
                const colorClass = getMedColor(m.nombre);
                const li = document.createElement('li');
                li.className = 'med-item';
                li.style.borderLeft = `3px solid var(--${colorClass.split('-')[1]})`;

                li.innerHTML = `
                    <div class="med-name-row">
                        <div class="med-name">${upper(m.nombre)}</div>
                        <div class="med-patient">${upper(m.paciente)}</div>
                    </div>
                    ${m.foto ? `<img src="${m.foto}" class="med-avatar">` : `<div class="med-placeholder ${colorClass}">💊</div>`}
                    <div class="med-info">
                        <div class="med-times">
                            ${m.horas.map(h => `<span class="time-chip" onclick="event.stopPropagation(); openEditTime('${id}', '${h.h}', '${h.cant}')">${h.h} · ${h.cant}u</span>`).join('')}
                            <button class="add-time-btn" onclick="event.stopPropagation(); openAddTime('${id}')">+</button>
                        </div>
                    </div>
                    <div class="med-actions"><button class="med-delete" onclick="event.stopPropagation(); deleteMed('${id}')">🗑️</button></div>
                `;
                li.onclick = () => showDetail(id);
                lista.appendChild(li);
            });
        }

        function getMedColor(n) {
            if(!medColors[n]) {
                const c = ['color-1', 'color-2'];
                medColors[n] = c[Object.keys(medColors).length % 2];
            }
            return medColors[n];
        }

        window.deleteMed = (id) => {
            if(confirm('¿Eliminar este medicamento y todos sus horarios?')) {
                delete meds[id]; save(); render();
            }
        };

        function showDetail(id) {
            const m = meds[id];
            $('detailName').textContent = upper(m.nombre);
            $('detailPatient').textContent = `PACIENTE: ${upper(m.paciente)}`;
            if(m.foto) { $('detailMainImg').src = m.foto; $('detailMainImg').style.display = 'block'; }
            else { $('detailMainImg').style.display = 'none'; }
            $('detailTimes').innerHTML = m.horas.map(h => `<div style="padding:10px; background:rgba(0,0,0,0.2); margin-top:5px; border-radius:8px;">${h.h} - ${h.cant} unidades</div>`).join('');
            $('detailModal').classList.add('open');
        }

        function openAddTime(id) {
            const h = prompt("Hora (HH:MM):", "08:00");
            const c = prompt("Cantidad:", "1");
            if(h && c) {
                meds[id].horas.push({h, cant: parseFloat(c)});
                meds[id].horas.sort((a,b) => a.h.localeCompare(b.h));
                save(); render();
            }
        }

        function openEditTime(id, h, c) {
            editingTimeData = {id, oldH: h};
            $('editHora').value = h;
            $('editCant').value = c;
            $('editTimeModal').classList.add('open');
        }

        // --- HANDLERS ---
        $('addBtn').onclick = () => {
            const n = upper(nombre.value), p = upper(paciente.value), h = hora.value, c = parseFloat(cant.value);
            if(!n || !h) return alert('Nombre y Hora son obligatorios');
            const id = Date.now().toString();
            meds[id] = { nombre: n, paciente: p || 'YO', foto, horas: [{h, cant: c || 1}] };
            save(); render();
            nombre.value = ''; paciente.value = ''; hora.value = ''; foto = '';
            $('photoPreview').style.display = 'none';
            cambiarTab('medicamentos');
        };

        photoZone.onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 600; canvas.height = (img.height * 600) / img.width;
                        ctx.drawImage(img, 0, 0, 600, canvas.height);
                        foto = canvas.toDataURL('image/jpeg', 0.6);
                        $('photoPreview').src = foto; $('photoPreview').style.display = 'block';
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        };

        $('saveEditTime').onclick = () => {
            const m = meds[editingTimeData.id];
            const idx = m.horas.findIndex(x => x.h === editingTimeData.oldH);
            m.horas[idx] = {h: $('editHora').value, cant: parseFloat($('editCant').value)};
            m.horas.sort((a,b) => a.h.localeCompare(b.h));
            save(); render(); $('editTimeModal').classList.remove('open');
        };

        $('deleteTime').onclick = () => {
            meds[editingTimeData.id].horas = meds[editingTimeData.id].horas.filter(x => x.h !== editingTimeData.oldH);
            if(meds[editingTimeData.id].horas.length === 0) delete meds[editingTimeData.id];
            save(); render(); $('editTimeModal').classList.remove('open');
        };

        $('alertTake').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            medsActuales.forEach(m => hist.push({fecha: new Date().toISOString(), nombre: m.nombre, paciente: m.paciente, hora: horaActual}));
            localStorage.setItem('tomasMC', JSON.stringify(hist));
            stopAlarm();
        };

        $('calBtn').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            $('calBody').innerHTML = hist.reverse().map(t => `
                <div style="padding:10px; border-bottom:1px solid #222;">
                    <b>${upper(t.nombre)}</b> - ${upper(t.paciente)}<br>
                    <small>${new Date(t.fecha).toLocaleString()}</small>
                </div>
            `).join('') || 'Sin registros';
            $('calModal').classList.add('open');
        };

        $('testBtn').onclick = () => {
            medsActuales = [{nombre: 'MEDICAMENTO TEST', paciente: 'ISRAEL', cantidad: 1, id: 'test'}];
            horaActual = 'TEST';
            dispararAlerta();
        };

        $('settingsToggle').onclick = () => {
            const p = $('settingsPanel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        };

        volSlider.oninput = function() { $('volValue').textContent = Math.round(this.value * 100) + '%'; };

        function cambiarTab(t) {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            $(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            $(`tabContent${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            if(t === 'medicamentos') render();
        }

        function save() { localStorage.setItem('medsMC2', JSON.stringify(meds)); }

        $('tabNuevo').onclick = () => cambiarTab('nuevo');
        $('tabMedicamentos').onclick = () => cambiarTab('medicamentos');
        $('alertClose').onclick = stopAlarm;
        $('detailClose').onclick = () => $('detailModal').classList.remove('open');
        $('calClose').onclick = () => $('calModal').classList.remove('open');
        $('cancelEditTime').onclick = () => $('editTimeModal').classList.remove('open');
        $('menos').onclick = () => { cant.value = Math.max(0.25, parseFloat(cant.value) - 0.25).toFixed(2); };
        $('mas').onclick = () => { cant.value = (parseFloat(cant.value) + 0.25).toFixed(2); };

        window.onload = () => { render(); initializeAlarmSystem(); };
    </script>
</body>
</html>
