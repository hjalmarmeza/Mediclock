<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>MediClock Neo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('SW registrado');
                }).catch(err => console.log('SW error', err));
            });
        }
    </script>
    
    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(15, 15, 25, 0.6);
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ea;
            --neon-violet: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-green: #00ff88;
            --neon-orange: #ff6b35;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --border-glow: rgba(0, 245, 255, 0.2);
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --glow-cyan: 0 0 30px rgba(0, 245, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Animaciones de Fondo */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .bg-animation::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 50%);
            animation: bgPulse 15s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 2rem 1rem; }

        /* FIX VISUAL: .med-item Estructura de Fila Superior 100% */
        .med-item {
            display: flex;
            flex-wrap: wrap; 
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            margin-bottom: 0.875rem;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
        }

        .med-item:hover { transform: translateX(5px); background: rgba(0, 245, 255, 0.05); }

        .med-name-row {
            display: flex;
            flex-direction: column;
            width: 100%; /* El nombre y paciente ocupan toda la parte superior */
            margin-bottom: 0.5rem;
            padding-right: 40px; /* Espacio para el botón de borrar */
        }

        .med-name {
            font-size: 1.25rem; font-weight: 700; color: var(--text-primary);
            text-transform: uppercase; letter-spacing: 0.02em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .med-patient { font-size: 0.85rem; color: var(--neon-cyan); font-weight: 600; }

        .med-avatar, .med-placeholder {
            width: 60px; height: 60px; border-radius: var(--radius-md);
            object-fit: cover; border: 2px solid rgba(0, 245, 255, 0.3);
            flex-shrink: 0;
        }

        .med-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .med-times { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }

        .med-actions {
            position: absolute; /* Sacamos las acciones del flujo */
            top: 1.25rem;
            right: 1.25rem;
        }

        .med-delete {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-muted); cursor: pointer;
        }

        /* Tabs y UI */
        .tabs { display: flex; background: rgba(10, 10, 20, 0.8); border-radius: 16px; padding: 0.25rem; margin-bottom: 1.5rem; }
        .tab { flex: 1; text-align: center; padding: 0.75rem; color: var(--text-secondary); background: transparent; border: none; cursor: pointer; border-radius: 12px; font-weight: 600; }
        .tab.active { background: rgba(0, 245, 255, 0.2); color: var(--neon-cyan); }

        .card { background: var(--bg-card); backdrop-filter: blur(40px); border-radius: var(--radius-xl); padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border-glow); }
        .form-input { width: 100%; padding: 1rem; margin-bottom: 1rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none; }
        .btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color: #000; box-shadow: var(--glow-cyan); }
        
        /* Modales */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(5,5,8,0.98); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-bg.open { display: flex; }
        .modal { background: #10101a; border: 1px solid var(--neon-cyan); border-radius: 24px; width: 100%; max-width: 420px; padding: 2rem; position: relative; }

        .time-chip { padding: 0.3rem 0.8rem; background: rgba(0,245,255,0.1); border: 1px solid var(--neon-cyan); border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        
        @media (max-width: 480px) {
            .med-name { font-size: 1.1rem; }
            .modal { padding: 1.5rem; }
        }
    </style>
</head>
    <body>
    <!-- HACK IOS/ANDROID: Audio Heartbeat para mantener proceso activo -->
    <audio id="iosWakeAudio" loop playsinline src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA"></audio>
    <audio id="mainAlarmAudio" loop playsinline></audio>

    <div class="bg-animation"></div>
    <div class="app">
        <header style="text-align: center; margin-bottom: 1.5rem;">
            <h1 style="font-size: 2rem; background: linear-gradient(var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;">MediClock NEO</h1>
        </header>

        <div class="tabs">
            <button class="tab active" id="tabNuevo" data-tab="nuevo">✨ Nuevo</button>
            <button class="tab" id="tabMedicamentos" data-tab="medicamentos">💊 Mis Meds</button>
        </div>

        <!-- Nueva Medicación -->
        <div id="contentNuevo">
            <div class="card">
                <input type="text" id="nombre" class="form-input" placeholder="Nombre del Medicamento">
                <input type="text" id="paciente" class="form-input" placeholder="Nombre del Paciente">
                <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <input type="number" id="cant" class="form-input" value="1" style="flex: 1; margin: 0;">
                    <input type="time" id="hora" class="form-input" style="flex: 2; margin: 0;">
                </div>
                <div id="photoZone" style="border: 2px dashed rgba(255,255,255,0.1); padding: 1rem; text-align: center; border-radius: 12px; margin-bottom: 1rem; cursor: pointer;">
                    <span id="photoText">📷 Toca para Foto (Opcional)</span>
                    <img id="photoPreview" style="display:none; width: 100%; border-radius: 8px; margin-top: 10px;">
                </div>
                <button class="btn btn-primary" id="addBtn">AGREGAR MEDICACIÓN</button>
            </div>
        </div>

        <!-- Lista de Medicamentos -->
        <div id="contentMedicamentos" style="display: none;">
            <ul id="lista" style="list-style: none;"></ul>
            <div id="empty" style="text-align: center; padding: 2rem; color: var(--text-muted);">Sin medicamentos programados</div>
            <div style="display: flex; gap: 10px; margin-top: 1rem;">
                <button class="btn" style="background: rgba(255,255,255,0.05); color: #fff;" id="calBtn">📅 Historial</button>
                <button class="btn" style="background: rgba(255,255,255,0.05); color: #fff;" id="testBtn">🧪 Probar Alarma</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ALARMA CRÍTICA -->
    <div class="modal-bg" id="alertModal">
        <div class="modal">
            <div style="font-size: 3rem; margin-bottom: 1rem; text-align: center;">⏰</div>
            <h2 id="alertTime" style="text-align: center; color: var(--neon-cyan); font-size: 2.5rem; margin-bottom: 1rem;">00:00</h2>
            <div id="alertMedList" style="margin-bottom: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;"></div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn" style="background: var(--neon-green); color: #000;" id="alertTake">✓ LO HE TOMADO</button>
                <button class="btn" style="background: #ff4757; color: #fff;" id="alertClose">CERRAR ALARMA</button>
            </div>
        </div>
    </div>

    <!-- OTROS MODALES (Detalle y Calendario) -->
    <div class="modal-bg" id="detailModal">
        <div class="modal">
            <h2 id="detName" style="color: var(--neon-cyan); margin-bottom: 1rem;"></h2>
            <p id="detPatient" style="color: var(--text-secondary); margin-bottom: 1rem;"></p>
            <div id="detTimes"></div>
            <button class="btn" style="margin-top: 1rem; background: rgba(255,255,255,0.1); color:#fff;" id="detClose">Cerrar</button>
        </div>
    </div>

    <div class="modal-bg" id="calModal">
        <div class="modal">
            <h2>Historial de Tomas</h2>
            <div id="calBody" style="max-height: 300px; overflow-y: auto; margin: 1rem 0;"></div>
            <button class="btn" id="calClose" style="background: rgba(255,255,255,0.1); color:#fff;">Cerrar</button>
        </div>
    </div>
        <script>
        // PERSISTENCIA Y VARIABLES
        let meds = JSON.parse(localStorage.getItem('medsMC2') || '{}');
        let fotoData = '';
        let medsActuales = [];
        let horaActual = '';
        const $ = id => document.getElementById(id);
        const upper = t => t ? t.toString().toUpperCase().trim() : '';

        // --- HACK DE FONDO Y AUDIO PARA IOS/ANDROID ---
        function initAudioEngine() {
            const wake = $('iosWakeAudio');
            wake.play().then(() => {
                console.log("🚀 Sistema de Audio Desbloqueado para Segundo Plano");
                // Mantenemos un volumen mínimo pero audible para el sistema
                wake.volume = 0.05; 
                window.removeEventListener('click', initAudioEngine);
                window.removeEventListener('touchstart', initAudioEngine);
            }).catch(e => console.log("Esperando interacción..."));

            // Pre-desbloqueo de Voz
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("");
                speechSynthesis.speak(utterance);
            }
        }
        window.addEventListener('click', initAudioEngine);
        window.addEventListener('touchstart', initAudioEngine);

        // --- SISTEMA DE ALARMAS ROBUSTO ---
        function checkAlarms() {
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const dateKey = now.toDateString();

            medsActuales = [];
            Object.keys(meds).forEach(id => {
                const m = meds[id];
                m.horas.forEach(h => {
                    if (h.h === time) {
                        medsActuales.push({ ...m, id, cantidad: h.cant });
                    }
                });
            });

            if (medsActuales.length > 0) {
                const fireKey = `fired_${time}_${dateKey}`;
                if (!localStorage.getItem(fireKey)) {
                    horaActual = time;
                    dispararAlarma();
                    localStorage.setItem(fireKey, 'true');
                }
            }
        }

        // Intervalo de alta frecuencia para no perder el minuto exacto
        setInterval(checkAlarms, 10000); 

        async function dispararAlarma() {
            // 1. Mostrar UI
            $('alertTime').textContent = horaActual;
            $('alertMedList').innerHTML = medsActuales.map(m => `
                <div style="margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;">
                    <div style="font-weight: 800; color: #fff;">${upper(m.nombre)}</div>
                    <div style="font-size: 0.8rem; color: var(--neon-cyan);">${upper(m.paciente)} - Toma ${m.cantidad} unidad(es)</div>
                </div>
            `).join('');
            $('alertModal').classList.add('open');

            // 2. Audio de Alarma
            const audio = $('mainAlarmAudio');
            audio.src = 'https://assets.mixkit.co/sfx/download/mixkit-digital-alarm-buzzer-992.wav';
            audio.volume = 1.0;
            audio.play().catch(e => console.log("Error Audio:", e));

            // 3. MediaSession (Para pantalla de bloqueo en iPhone/Android)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'ALERTA DE MEDICACIÓN',
                    artist: 'MediClock Neo',
                    album: horaActual,
                    artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/1237/1237460.png', sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('stop', stopAlarm);
            }

            // 4. Voz (Speech)
            await hablarAlarma();
        }

        function hablarAlarma() {
            return new Promise(resolve => {
                if (!('speechSynthesis' in window)) return resolve();
                speechSynthesis.cancel();
                let texto = `Atención, son las ${horaActual}. Es hora de tomar tu medicación. `;
                medsActuales.forEach(m => {
                    texto += `${m.paciente}, toma ${m.cantidad} unidades de ${m.nombre}. `;
                });
                const utter = new SpeechSynthesisUtterance(texto);
                utter.lang = 'es-ES';
                utter.rate = 0.9;
                utter.onend = () => resolve();
                speechSynthesis.speak(utter);
            });
        }

        function stopAlarm() {
            $('mainAlarmAudio').pause();
            speechSynthesis.cancel();
            $('alertModal').classList.remove('open');
        }
            // --- GESTIÓN DE MEDICAMENTOS Y RENDER ---
        function render() {
            const lista = $('lista');
            lista.innerHTML = '';
            const keys = Object.keys(meds);
            $('empty').style.display = keys.length ? 'none' : 'block';

            keys.forEach(id => {
                const m = meds[id];
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-name-row">
                        <div class="med-name" title="${m.nombre}">${upper(m.nombre)}</div>
                        <div class="med-patient">${upper(m.paciente)}</div>
                    </div>
                    ${m.foto ? `<img src="${m.foto}" class="med-avatar">` : `<div class="med-placeholder">💊</div>`}
                    <div class="med-info">
                        <div class="med-times">
                            ${m.horas.map(h => `<span class="time-chip">${h.h} · ${h.cant}u</span>`).join('')}
                        </div>
                    </div>
                    <div class="med-actions">
                        <button class="med-delete" onclick="eliminarMed('${id}')">🗑️</button>
                    </div>
                `;
                li.onclick = (e) => { if(!e.target.closest('.med-delete')) mostrarDetalle(id); };
                lista.appendChild(li);
            });
        }

        function save() { localStorage.setItem('medsMC2', JSON.stringify(meds)); }

        window.eliminarMed = (id) => {
            if (confirm('¿Eliminar este medicamento?')) { delete meds[id]; save(); render(); }
        };

        function mostrarDetalle(id) {
            const m = meds[id];
            $('detName').textContent = upper(m.nombre);
            $('detPatient').textContent = `Paciente: ${upper(m.paciente)}`;
            $('detTimes').innerHTML = m.horas.map(h => `<div style="padding:0.5rem; background:rgba(0,0,0,0.2); margin:0.3rem 0; border-radius:8px;">${h.h} - ${h.cant} unidades</div>`).join('');
            $('detailModal').classList.add('open');
        }

        // --- HANDLERS ---
        $('addBtn').onclick = () => {
            const n = $('nombre').value;
            const p = $('paciente').value;
            const h = $('hora').value;
            if (!n || !h) return alert("Nombre y Hora son obligatorios");

            const id = Date.now().toString();
            meds[id] = {
                nombre: n,
                paciente: p || 'PACIENTE',
                foto: fotoData,
                horas: [{ h: h, cant: $('cant').value || 1 }]
            };
            save();
            render();
            // Reset y switch
            $('nombre').value = ''; $('paciente').value = ''; $('hora').value = ''; fotoData = '';
            $('photoPreview').style.display = 'none'; $('photoText').style.display = 'block';
            $('tabMedicamentos').click();
        };

        $('photoZone').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fotoData = ev.target.result;
                    $('photoPreview').src = fotoData;
                    $('photoPreview').style.display = 'block';
                    $('photoText').style.display = 'none';
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        };

        $('alertTake').onclick = () => {
            const history = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            medsActuales.forEach(m => {
                history.push({ fecha: new Date().toISOString(), nombre: m.nombre, paciente: m.paciente, hora: horaActual });
            });
            localStorage.setItem('tomasMC', JSON.stringify(history));
            stopAlarm();
        };

        $('calBtn').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            $('calBody').innerHTML = hist.reverse().map(t => `
                <div style="padding:0.8rem; border-bottom:1px solid #222;">
                    <b>${upper(t.nombre)}</b> - ${t.paciente}<br>
                    <small>${new Date(t.fecha).toLocaleString()}</small>
                </div>
            `).join('') || 'Sin registros.';
            $('calModal').classList.add('open');
        };

        $('testBtn').onclick = () => {
            medsActuales = [{ nombre: 'MEDICAMENTO DE PRUEBA', paciente: 'USUARIO', cant: 1 }];
            horaActual = "TEST";
            dispararAlarma();
        };

        $('alertClose').onclick = stopAlarm;
        $('detClose').onclick = () => $('detailModal').classList.remove('open');
        $('calClose').onclick = () => $('calModal').classList.remove('open');

        $('tabNuevo').onclick = () => {
            $('tabNuevo').classList.add('active'); $('tabMedicamentos').classList.remove('active');
            $('contentNuevo').style.display = 'block'; $('contentMedicamentos').style.display = 'none';
        };
        $('tabMedicamentos').onclick = () => {
            $('tabMedicamentos').classList.add('active'); $('tabNuevo').classList.remove('active');
            $('contentMedicamentos').style.display = 'block'; $('contentNuevo').style.display = 'none';
            render();
        };

        window.onload = render;
    </script>
</body>
</html>
