<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>MediClock Neo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes"> <!-- Mejor práctica -->
    <meta name="theme-color" content="#00f5ff">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registrado:', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker error:', err);
                });
            });
        }
    </script>
    
    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(15, 15, 25, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.02);
            
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ea;
            --neon-violet: #8b5cf6;
            --neon-blue: #3b82f6;
            --neon-green: #00ff88;
            --neon-orange: #ff6b35;
            --neon-yellow: #ffd700;
            --neon-pink: #ff1493;
            --neon-teal: #00ced1;
            
            --glow-cyan: 0 0 30px rgba(0, 245, 255, 0.4);
            --glow-magenta: 0 0 30px rgba(255, 0, 234, 0.4);
            --glow-violet: 0 0 30px rgba(139, 92, 246, 0.4);
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            
            --border-glow: rgba(0, 245, 255, 0.2);
            
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 0, 234, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-5%, -5%) scale(1.1); }
            66% { transform: translate(5%, 5%) scale(0.95); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: var(--neon-magenta); bottom: -50px; left: -50px; animation-delay: -7s; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-violet); top: 50%; left: 50%; animation-delay: -14s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, -50px) rotate(90deg); }
            50% { transform: translate(-30px, 30px) rotate(180deg); }
            75% { transform: translate(20px, 50px) rotate(270deg); }
        }

        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; 
            box-shadow: var(--glow-cyan), var(--glow-magenta);
            animation: iconPulse 3s ease-in-out infinite;
            position: relative;
        }

        .logo-text {
            font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-violet));
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text;
        }

        .tabs {
            display: flex; 
            background: rgba(10, 10, 20, 0.8); 
            border-radius: var(--radius-lg);
            padding: 0.25rem; 
            margin-bottom: 1.5rem; 
            border: 1px solid rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .tab {
            flex: 1; 
            text-align: center; 
            padding: 0.75rem 1rem; 
            font-size: 0.9rem;
            font-weight: 600; 
            color: var(--text-secondary); 
            background: transparent;
            border: none; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            transition: 0.3s;
        }

        .tab.active { 
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(139, 92, 246, 0.15)); 
            color: var(--neon-cyan); 
        }

        .tab-content { 
            display: none; 
            animation: fadeIn 0.4s ease; 
        }
        .tab-content.active { 
            display: block; 
        }

        .card {
            background: var(--bg-card); 
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-glow); 
            border-radius: var(--radius-xl);
            padding: 1.75rem; 
            margin-bottom: 1.5rem; 
            position: relative; 
            overflow: hidden;
        }

        .form-group { 
            margin-bottom: 1.5rem; 
        }
        .form-label { 
            display: block; 
            font-size: 0.7rem; 
            font-weight: 600; 
            color: var(--neon-cyan); 
            text-transform: uppercase; 
            margin-bottom: 0.6rem; 
        }
        .form-input { 
            width: 100%; 
            padding: 1rem 1.25rem; 
            color: var(--text-primary); 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: var(--radius-md); 
            outline: none;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
        }

        /* Corrección para iPhone: input time */
        .form-input[type="time"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            box-sizing: border-box;
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .qty-row { 
            display: flex; 
            gap: 0.75rem; 
            align-items: center;
        }
        .qty-btn { 
            width: 52px; 
            height: 52px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: var(--radius-md); 
            color: var(--neon-cyan); 
            font-size: 1.5rem; 
            cursor: pointer; 
        }

        .med-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            margin-bottom: 0.875rem;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            min-height: auto;
        }

        .med-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .med-name-row {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
            padding-right: 10px;
        }

        .med-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            word-wrap: break-word;
            white-space: normal;
            line-height: 1.3;
            width: 100%;
            overflow-wrap: break-word;
        }

        .med-patient { 
            font-size: 0.85rem; 
            color: var(--neon-cyan); 
            font-weight: 600; 
        }

        .med-avatar, .med-placeholder {
            width: 60px; 
            height: 60px; 
            border-radius: var(--radius-md);
            object-fit: cover; 
            border: 2px solid rgba(0, 245, 255, 0.3);
            flex-shrink: 0;
            align-self: flex-end;
            margin-top: 0.5rem;
        }

        .med-info { 
            width: 100%;
            display: flex; 
            flex-direction: column;
            margin-top: 0.5rem;
        }

        .med-times { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 0.4rem; 
            align-items: center; 
        }

        .med-actions { 
            position: absolute; 
            top: 1rem; 
            right: 1rem;
            z-index: 10;
        }

        .med-delete {
            width: 36px; 
            height: 36px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; 
            color: var(--text-muted); 
            cursor: pointer;
        }

        .time-chip { 
            display: inline-flex; 
            align-items: center; 
            padding: 0.35rem 0.8rem; 
            font-size: 0.75rem; 
            font-weight: 600; 
            background: rgba(0, 245, 255, 0.1); 
            border: 1px solid rgba(0, 245, 255, 0.3); 
            border-radius: 20px; 
        }

        .photo-zone { 
            border: 2px dashed rgba(0, 245, 255, 0.3); 
            border-radius: var(--radius-lg); 
            padding: 2rem; 
            text-align: center; 
            cursor: pointer; 
        }
        .photo-preview { 
            width: 100%; 
            aspect-ratio: 16/9; 
            object-fit: cover; 
            border-radius: var(--radius-lg); 
            border: 2px solid var(--neon-cyan); 
            display: none; 
        }
        .photo-preview.active { 
            display: block; 
        }

        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem 1.75rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            border-radius: var(--radius-md); 
            border: none; 
            cursor: pointer; 
            transition: 0.4s; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); 
            color: var(--bg-dark); 
            width: 100%; 
        }
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--text-primary); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .btn-danger { 
            background: #ff4757; 
            color: white; 
        }
        .btn-success { 
            background: var(--neon-green); 
            color: var(--bg-dark); 
        }

        .modal-bg { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(5, 5, 8, 0.95); 
            backdrop-filter: blur(20px); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
            padding: 1.25rem; 
        }
        .modal-bg.open { 
            display: flex; 
        }
        .modal { 
            background: linear-gradient(180deg, rgba(20, 20, 35, 0.95), rgba(10, 10, 18, 0.98)); 
            border: 1px solid rgba(0, 245, 255, 0.2); 
            border-radius: var(--radius-xl); 
            width: 100%; 
            max-width: 420px; 
            max-height: 85vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        .alert-clock-icon { 
            width: 80px; 
            height: 80px; 
            margin: 0 auto 1.5rem; 
            background: var(--neon-cyan); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2.5rem; 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 
            0% { transform: scale(1); opacity: 1; } 
            50% { transform: scale(1.1); opacity: 0.7; } 
            100% { transform: scale(1); opacity: 1; } 
        }

        .scanline { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 2px; 
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent); 
            opacity: 0.3; 
            animation: scan 8s linear infinite; 
            pointer-events: none; 
            z-index: 9999; 
        }
        @keyframes scan { 
            0% { top: 0; } 
            100% { top: 100%; } 
        }

        .color-1 { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); }
        .color-2 { background: linear-gradient(135deg, var(--neon-magenta), var(--neon-violet)); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Audio silencioso para iOS background -->
    <audio id="iosWakeAudio" loop playsinline muted preload="auto" src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA"></audio>

    <div class="bg-animation"></div>
    <div class="grid-pattern"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanline"></div>

    <div class="app">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">💊</div>
                <span class="logo-text">MediClock</span>
                <span class="logo-badge" style="font-size:0.9em; opacity:0.7;">NEO</span>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" id="tabNuevo" data-tab="nuevo">✨ Nuevo</button>
            <button class="tab" id="tabMedicamentos" data-tab="medicamentos">💊 Mis Medicamentos</button>
        </div>

        <div class="tab-content active" id="tabContentNuevo">
            <div class="card">
                <div class="form-group">
                    <label class="form-label">Medicamento</label>
                    <input type="text" id="nombre" class="form-input" placeholder="Ej: Paracetamol">
                </div>
                <div class="form-group">
                    <label class="form-label">Paciente</label>
                    <input type="text" id="paciente" class="form-input" placeholder="Ej: Israel">
                </div>
                <div class="form-group">
                    <label class="form-label">Cantidad</label>
                    <div class="qty-row">
                        <button class="qty-btn" id="menos">−</button>
                        <input type="number" id="cant" class="form-input" value="1" step="0.25" style="text-align:center">
                        <button class="qty-btn" id="mas">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Hora</label>
                    <input type="time" id="hora" class="form-input">
                </div>
                <div class="form-group">
                    <div class="photo-zone" id="photoZone">📷 Capturar Foto</div>
                    <img id="photoPreview" class="photo-preview">
                </div>
                <button class="btn btn-primary" id="addBtn">⚡ AGREGAR</button>
                
                <div class="settings" style="margin-top:2rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem;">
                    <div id="settingsToggle" style="cursor:pointer; display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-secondary);">
                        <span>⚙️ AJUSTES DE ALERTA</span>
                        <span id="settingsArrow">▼</span>
                    </div>
                    <div id="settingsPanel" style="display:none; padding-top:1rem;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                            <span>Sonido</span>
                            <input type="checkbox" id="sonidoOn" checked>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                            <span>Voz</span>
                            <input type="checkbox" id="vozOn" checked>
                        </div>
                        <div style="margin-bottom:1rem;">
                            <span>Volumen</span>
                            <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.7" style="width:100%">
                            <span id="volValue" style="font-size:0.7rem">70%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tabContentMedicamentos">
            <div class="card">
                <ul class="med-list" id="lista"></ul>
                <div class="empty" id="empty" style="text-align:center; padding:2rem;">
                    <h3>Sin medicamentos</h3>
                </div>
                <div style="display:flex; gap:10px; margin-top:1rem;">
                    <button class="btn btn-secondary" id="calBtn" style="flex:1">📅 Historial</button>
                    <!-- ❌ Botón "Probar alarma" ELIMINADO -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div class="modal-bg" id="alertModal">
        <div class="modal" style="padding:2rem; text-align:center;">
            <div class="alert-clock-icon">⏰</div>
            <h2 id="alertGreeting">Hola</h2>
            <div id="alertTimeDisplay" style="font-size:2rem; color:var(--neon-cyan); margin:1rem 0;">00:00</div>
            <div id="alertMedicationsList" style="margin-bottom:2rem;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-danger" id="alertClose" style="flex:1">Cerrar</button>
                <button class="btn btn-success" id="alertTake" style="flex:1">✓ Tomado</button>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="detailModal">
        <div class="modal" style="padding:2rem;">
            <img id="detailMainImg" class="photo-preview active" style="margin-bottom:1rem;">
            <h2 id="detailName"></h2>
            <p id="detailPatient" style="color:var(--neon-cyan); margin-bottom:1rem;"></p>
            <div id="detailTimes"></div>
            <button class="btn btn-secondary" id="detailClose" style="margin-top:1rem; width:100%;">Cerrar</button>
        </div>
    </div>

    <div class="modal-bg" id="addTimeModal">
        <div class="modal" style="padding:2rem;">
            <h3>Añadir horario</h3>
            <input type="time" id="newHora" class="form-input" style="margin:1rem 0;">
            <input type="number" id="newCant" class="form-input" value="1" step="0.25">
            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button class="btn btn-secondary" id="cancelAddTime" style="flex:1">Cancelar</button>
                <button class="btn btn-primary" id="saveAddTime" style="flex:1">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="editTimeModal">
        <div class="modal" style="padding:2rem;">
            <h3>Editar horario</h3>
            <input type="time" id="editHora" class="form-input" style="margin:1rem 0;">
            <input type="number" id="editCant" class="form-input" step="0.25">
            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button class="btn btn-danger" id="deleteTime" style="flex:1">Eliminar</button>
                <button class="btn btn-primary" id="saveEditTime" style="flex:1">Guardar</button>
            </div>
            <button class="btn btn-secondary" id="cancelEditTime" style="width:100%; margin-top:10px;">Cancelar</button>
        </div>
    </div>

    <div class="modal-bg" id="calModal">
        <div class="modal" style="padding:2rem;">
            <h2>Historial de tomas</h2>
            <div id="calBody" style="max-height:300px; overflow-y:auto; margin:1rem 0; font-size:0.8rem;"></div>
            <button class="btn btn-secondary" id="calClose" style="width:100%;">Cerrar</button>
        </div>
    </div>

    <audio id="audio" preload="auto" loop playsinline></audio>

    <script>
        // Función $ para simplificar document.getElementById
        const $ = id => document.getElementById(id);

        // Audio hack para iOS background
        function initAudioHack() {
            const silentAudio = document.getElementById('iosWakeAudio');
            if (silentAudio) {
                silentAudio.muted = false;
                silentAudio.play().then(() => {
                    console.log("🔊 Audio background activado para iOS");
                    window.removeEventListener('touchstart', initAudioHack);
                    window.removeEventListener('click', initAudioHack);
                }).catch(err => console.warn("🔇 Audio background bloqueado:", err));
            }
        }
        window.addEventListener('touchstart', initAudioHack, { once: true });
        window.addEventListener('click', initAudioHack, { once: true });

        // Variables
        let meds = JSON.parse(localStorage.getItem('medsMC2') || '{}');
        let foto = '';
        let alarmaOn = false;
        let medsActuales = [];
        let horaActual = '';
        let intervalo = null;
        let medColors = {};
        let currentMedForAddTime = null;
        let editingTimeData = null;
        let checkInterval = null;
        let lastAlertTimestamp = 0;

        const upper = t => t ? t.toString().toUpperCase().trim() : '';

        // Sistema de alarmas
        function initializeAlarmSystem() {
            if ('Notification' in window) Notification.requestPermission();
            checkAlarms();
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkAlarms, 15000);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) checkAlarms();
            });
        }

        function checkAlarms() {
            const now = new Date();
            const timeKey = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const currentMinuteStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), 0, 0).getTime();

            if (lastAlertTimestamp >= currentMinuteStart) return;

            medsActuales = [];
            let trigger = false;

            Object.keys(meds).forEach(id => {
                const m = meds[id];
                m.horas.forEach(h => {
                    if (h.h === timeKey) {
                        medsActuales.push({id, paciente: m.paciente, nombre: m.nombre, cantidad: h.cant, foto: m.foto});
                        trigger = true;
                    }
                });
            });

            if (trigger && medsActuales.length > 0) {
                lastAlertTimestamp = currentMinuteStart;
                horaActual = timeKey;
                showAlert();
            }
        }

        async function playVoiceReminder() {
            if (!vozOn.checked || !('speechSynthesis' in window)) return true;

            return new Promise((resolve) => {
                speechSynthesis.cancel();
                const pacientes = [...new Set(medsActuales.map(m => m.paciente))];
                let msg = `Hola ${pacientes.join(' y ')}. Es hora de tu medicación. `;
                medsActuales.forEach(m => msg += `Toma ${m.cantidad} unidades de ${m.nombre}. `;

                const u = new SpeechSynthesisUtterance(msg);
                u.lang = 'es-ES';
                u.volume = parseFloat(volSlider.value);
                u.rate = 0.85;

                u.onend = u.onerror = () => resolve();
                speechSynthesis.speak(u);
                setTimeout(resolve, 12000);
            });
        }

        function playAlarmSound() {
            if (!sonidoOn.checked || alarmaOn) return;
            const audio = $('audio');
            audio.src = 'https://assets.mixkit.co/sfx/download/mixkit-digital-alarm-buzzer-992.wav';
            audio.loop = true;
            audio.volume = parseFloat(volSlider.value);
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'MediClock NEO: ¡Hora de medicación!',
                    artist: 'Alerta Activa',
                    artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/1237/1237460.png', sizes: '512x512', type: 'image/png' }]
                });
            }

            audio.play().then(() => {
                alarmaOn = true;
            }).catch(() => {
                intervalo = setInterval(() => {
                    const fallback = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3');
                    fallback.volume = parseFloat(volSlider.value);
                    fallback.play().catch(() => {});
                }, 3000);
            });
        }

        async function showAlert() {
            const pacientes = [...new Set(medsActuales.map(m => m.paciente))];
            $('alertGreeting').textContent = `Hola ${pacientes.join(' y ')}`;
            $('alertTimeDisplay').textContent = horaActual;
            $('alertMedicationsList').innerHTML = medsActuales.map(m => 
                `<div style="padding:10px; border-bottom:1px solid #333;"><b>${upper(m.nombre)}</b>: ${m.cantidad} unidades</div>`
            ).join('');

            alertModal.classList.add('open');

            await playVoiceReminder();
            playAlarmSound();

            if ('vibrate' in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
        }

        function stopAlarm() {
            alarmaOn = false;
            if (intervalo) clearInterval(intervalo);
            $('audio').pause();
            $('audio').currentTime = 0;
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        function render() {
            lista.innerHTML = '';
            const keys = Object.keys(meds);
            empty.style.display = keys.length ? 'none' : 'block';

            keys.forEach(id => {
                const m = meds[id];
                const colorClass = getMedColor(m.nombre);
                const li = document.createElement('li');
                li.className = 'med-item';

                li.innerHTML = `
                    <div class="med-header">
                        <div class="med-name-row">
                            <div class="med-name">${upper(m.nombre)}</div>
                            <div class="med-patient">${upper(m.paciente)}</div>
                        </div>
                        <div class="med-actions">
                            <button class="med-delete" onclick="event.stopPropagation(); deleteMed('${id}')">🗑️</button>
                        </div>
                    </div>
                    ${m.foto ? `<img src="${m.foto}" class="med-avatar">` : `<div class="med-placeholder ${colorClass}">💊</div>`}
                    <div class="med-info">
                        <div class="med-times">
                            ${m.horas.map(h => `<span class="time-chip" onclick="event.stopPropagation(); openEditTimeModal('${id}', '${h.h}', '${h.cant}')">${h.h} · ${h.cant}u</span>`).join('')}
                            <button class="add-time-btn" onclick="event.stopPropagation(); openAddTimeModal('${id}')" style="width:32px;height:32px;background:rgba(0,245,255,0.1);border:1px solid rgba(0,245,255,0.3);border-radius:50%;color:var(--neon-cyan);cursor:pointer;">+</button>
                        </div>
                    </div>
                `;
                li.onclick = () => showDetail(id);
                lista.appendChild(li);
            });
        }

        function getMedColor(n) {
            if (!medColors[n]) {
                const classes = ['color-1', 'color-2'];
                medColors[n] = classes[Object.keys(medColors).length % 2];
            }
            return medColors[n];
        }

        window.deleteMed = (id) => {
            if (confirm('¿Eliminar medicamento?')) {
                delete meds[id];
                save();
                render();
            }
        }

        function openAddTimeModal(id) {
            currentMedForAddTime = id;
            addTimeModal.classList.add('open');
        }

        function openEditTimeModal(id, h, c) {
            editingTimeData = {id, oldH: h};
            $('editHora').value = h;
            $('editCant').value = c;
            editTimeModal.classList.add('open');
        }

        function showDetail(id) {
            const m = meds[id];
            $('detailName').textContent = upper(m.nombre);
            $('detailPatient').textContent = upper(m.paciente);
            $('detailMainImg').src = m.foto || '';
            $('detailMainImg').style.display = m.foto ? 'block' : 'none';
            $('detailTimes').innerHTML = m.horas.map(h => 
                `<div style="padding:10px; background:rgba(0,0,0,0.3); margin-bottom:5px; border-radius:8px;">${h.h} - ${h.cant}u</div>`
            ).join('');
            detailModal.classList.add('open');
        }

        function save() {
            localStorage.setItem('medsMC2', JSON.stringify(meds));
        }

        // Handlers
        $('addBtn').onclick = () => {
            const n = upper(nombre.value), p = upper(paciente.value), h = hora.value, c = parseFloat(cant.value);
            if (!n || !h) return alert('Faltan datos');
            const id = Date.now().toString();
            meds[id] = { nombre: n, paciente: p, foto, horas: [{h, cant: c}] };
            save(); render();
            nombre.value = ''; paciente.value = ''; foto = ''; photoPreview.classList.remove('active');
            cambiarTab('medicamentos');
        };

        photoZone.onclick = () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 400;
                        canvas.height = (img.height * 400) / img.width;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        foto = canvas.toDataURL('image/jpeg', 0.7);
                        photoPreview.src = foto;
                        photoPreview.classList.add('active');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        };

        $('saveAddTime').onclick = () => {
            const h = $('newHora').value, c = parseFloat($('newCant').value);
            if (!h) return;
            meds[currentMedForAddTime].horas.push({h, cant: c});
            meds[currentMedForAddTime].horas.sort((a,b) => a.h.localeCompare(b.h));
            save(); render(); addTimeModal.classList.remove('open');
        };

        $('saveEditTime').onclick = () => {
            const m = meds[editingTimeData.id];
            const idx = m.horas.findIndex(x => x.h === editingTimeData.oldH);
            m.horas[idx] = {h: $('editHora').value, cant: parseFloat($('editCant').value)};
            m.horas.sort((a,b) => a.h.localeCompare(b.h));
            save(); render(); editTimeModal.classList.remove('open');
        };

        $('deleteTime').onclick = () => {
            const m = meds[editingTimeData.id];
            m.horas = m.horas.filter(x => x.h !== editingTimeData.oldH);
            if (m.horas.length === 0) delete meds[editingTimeData.id];
            save(); render(); editTimeModal.classList.remove('open');
        };

        $('alertTake').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            medsActuales.forEach(m => hist.push({
                fecha: new Date().toISOString(),
                nombre: m.nombre,
                paciente: m.paciente,
                hora: horaActual
            }));
            localStorage.setItem('tomasMC', JSON.stringify(hist));
            alertModal.classList.remove('open');
            stopAlarm();
        };

        $('calBtn').onclick = () => {
            const hist = JSON.parse(localStorage.getItem('tomasMC') || '[]');
            $('calBody').innerHTML = hist.length ? 
                hist.reverse().map(t => `
                    <div style="padding:10px; border-bottom:1px solid #222;">
                        <b>${upper(t.nombre)}</b> - ${upper(t.paciente)}<br>
                        <small>${new Date(t.fecha).toLocaleString()}</small>
                    </div>
                `).join('') : 'Sin registros';
            calModal.classList.add('open');
        };

        $('menos').onclick = () => { 
            const val = parseFloat(cant.value) || 1;
            cant.value = Math.max(0.25, val - 0.25).toFixed(2); 
        };
        $('mas').onclick = () => { 
            const val = parseFloat(cant.value) || 1;
            cant.value = (val + 0.25).toFixed(2); 
        };
        
        $('settingsToggle').onclick = () => {
            const p = $('settingsPanel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
            $('settingsArrow').textContent = p.style.display === 'none' ? '▼' : '▲';
        };

        volSlider.oninput = function() { 
            $('volValue').textContent = Math.round(this.value * 100) + '%'; 
        };

        function cambiarTab(t) {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            $(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            $(`tabContent${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.add('active');
            if (t === 'medicamentos') render();
        }

        $('tabNuevo').onclick = () => cambiarTab('nuevo');
        $('tabMedicamentos').onclick = () => cambiarTab('medicamentos');
        $('alertClose').onclick = () => { alertModal.classList.remove('open'); stopAlarm(); };
        $('detailClose').onclick = () => detailModal.classList.remove('open');
        $('calClose').onclick = () => calModal.classList.remove('open');
        $('cancelAddTime').onclick = () => addTimeModal.classList.remove('open');
        $('cancelEditTime').onclick = () => editTimeModal.classList.remove('open');

        window.onload = () => { 
            render(); 
            initializeAlarmSystem(); 
        };
    </script>
</body>
</html>
